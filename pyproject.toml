[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vscell"
version = "0.1.0.dev0"
description = "VLM-ranked consensus ensemble for microscopy instance segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "VSCell authors"}]
keywords = ["cell-segmentation", "microscopy", "vision-language-model", "ensemble"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=10",
  "tifffile>=2023.7.10",
]

[project.optional-dependencies]
vlm-openai = ["openai>=1.40"]
vlm-anthropic = ["anthropic>=0.34"]
student = ["torch>=2.1"]
test = ["pytest>=8", "pytest-cov>=5"]
all = ["openai>=1.40", "anthropic>=0.34", "torch>=2.1"]

[project.scripts]
vscell = "vscell.cli:main"

[project.urls]
Homepage = "https://github.com/jacobian99/VSCell"
Repository = "https://github.com/jacobian99/VSCell"
Issues = "https://github.com/jacobian99/VSCell/issues"
Documentation = "https://github.com/jacobian99/VSCell/blob/main/docs/USER_GUIDE.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
